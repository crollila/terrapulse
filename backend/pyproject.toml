[project]
name = "terrapulse"
version = "0.1.0"
description = "TerraPulse: Earth-system trend detection with honest uncertainty (NASA Space Apps 2026). Code generated with an SI coding assistant (Anthropic Claude); see README."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "httpx>=0.27",
]

[dependency-groups]
# Needed only to turn gridded MOD13C2 files into regional CSVs (terrapulse.ndvi_regions).
ndvi = ["xarray>=2024.6", "netCDF4>=1.7"]
dev = ["pytest>=8", "pymannkendall>=1.4", { include-group = "ndvi" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.uv]
package = false
